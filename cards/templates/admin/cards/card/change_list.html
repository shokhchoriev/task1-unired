{% extends "admin/change_list.html" %}

{% block content %}
<style>
.custom-admin-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1rem;
}
.custom-admin-toolbar a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    text-decoration: none;
    font-size: 0.92rem;
    white-space: nowrap;
    transition: background 0.2s ease;
}
.custom-admin-toolbar a:hover {
    background: rgba(255,255,255,0.18);
}
</style>
<div class="custom-admin-toolbar">
    <a href="?status__exact=active">SHOW ACTIVE</a>
    <a href="?status__exact=inactive">SHOW INACTIVE</a>
    <a href="?status__exact=expired">SHOW EXPIRED</a>
    <a href="?phone_ucell=yes">SHOW +99850 CARDS</a>
    <a href="?balance_gt_1000=yes">SHOW BALANCE > 1000</a>
    <a href="?balance_lt_1000=yes">SHOW BALANCE < 1000</a>
    <a href="?top_transactions=top5">SHOW TOP 5 CARDS</a>
    <a href="{{ import_excel_url }}{% if current_query_string %}?{{ current_query_string }}{% endif %}">IMPORT EXCEL/CSV</a>
    <a href="{{ export_csv_url }}{% if current_query_string %}?{{ current_query_string }}{% endif %}">EXPORT FILTERED</a>
</div>
{{ block.super }}
{% endblock %}
